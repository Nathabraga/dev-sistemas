<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>Tela de Login</header>
    <main>
        <selection>
            <h2>Entrar no sistema</h2> 
            <form id = "form-login" action="#" method="post" novalitade>
                <fieldset>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Ex: natha@email.com" required minlength="3" maxlength="100">
                    </div>
                    <div>
                        <label for="senha">Senha</label>    
                        <input type="password" id="senha" name="senha" placeholder="Ex: 123456" required minlength="6">
                    </div>
                    <div>
                        <label for="lembrar">Lembrar-me</label>
                        <input type="checkbox" id="lembrar" name="lembrar">
                    </div>
                    <button type="submit">Enviar formulario</button> 
                    <a href="#">esqueci minha senha</a> 
                </fieldset>
            </form>
  
        </selection>
    </main>
<footer>
    <p>
        empresa do Nathã braga 2026- de sobradinho para o mundo
    </p>
</footer>
</body>
</html>
